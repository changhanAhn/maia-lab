<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Work with us — AI for Energy &amp; Manufacturing Lab</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/site.css?v=20261022o">
</head>
<body data-page="work">
<div class="stage" id="stage"><div class="page" id="page">
  <div class="info-head">
    <div class="ck" data-ko="함께하기" data-en="WORK WITH US"></div>
    <h1 class="h2" data-ko="검토할 <em>작업</em>을 알려 주세요." data-en="Tell us about the <em>task</em>."></h1>
    <p class="lead" data-ko="현장 문제, 수업 과제, 연구 질문에서 시작합니다. 목적과 보유 자료를 바탕으로 함께 확인할 범위를 정합니다." data-en="Start with a field problem, a teaching task or a research question. Your goal and available evidence define what we can examine together."></p>
  </div>
  <div class="routes">
    <section class="card rise">
      <div class="ck">01</div><h3 data-ko="기업·현장" data-en="Industry · field teams"></h3>
      <p data-ko="검사·제어·에너지 관리에서 AI를 적용할 작업과 사람이 맡을 판단을 나눕니다." data-en="Identify tasks for AI and decisions for people in inspection, control and energy management."></p>
      <p class="inputs" data-ko="준비할 자료: 작업 흐름, 현재 문제, 공유 가능한 기록, 성공을 확인할 기준." data-en="Useful inputs: workflow, current problem, shareable records and criteria for a useful result."></p>
      <a class="contact-link inquiry" data-topic="0" href="mailto:chahn@kopo.ac.kr" data-ko="현장 작업 문의 ↗" data-en="Discuss a field task ↗"></a>
    </section>
    <section class="card rise" style="animation-delay:.1s">
      <div class="ck">02</div><h3 data-ko="교육자·학생" data-en="Educators · students"></h3>
      <p data-ko="공개 데이터와 재현 가능한 실험을 수업·실습·포트폴리오 과제로 연결합니다." data-en="Use open data and reproducible experiments for teaching, practical exercises and portfolio projects."></p>
      <p class="inputs" data-ko="준비할 자료: 학습 대상, 학습목표, 사용할 장비, 수업 시간과 제약." data-en="Useful inputs: learners, objectives, available equipment, teaching time and constraints."></p>
      <a class="contact-link inquiry" data-topic="1" href="mailto:chahn@kopo.ac.kr" data-ko="교육·실습 문의 ↗" data-en="Discuss teaching ↗"></a>
    </section>
    <section class="card rise" style="animation-delay:.2s">
      <div class="ck">03</div><h3 data-ko="연구자" data-en="Researchers"></h3>
      <p data-ko="AI 적용성, 현장 판정, 전력계통 연구의 질문과 검증 방법을 함께 검토합니다." data-en="Examine research questions and validation methods in AI applicability, field decisions and power systems."></p>
      <p class="inputs" data-ko="준비할 자료: 연구 질문, 선행연구, 공개 가능한 데이터·코드, 협업할 범위." data-en="Useful inputs: research question, prior work, shareable data or code and proposed scope."></p>
      <a class="contact-link inquiry" data-topic="2" href="mailto:chahn@kopo.ac.kr" data-ko="공동연구 문의 ↗" data-en="Discuss research ↗"></a>
    </section>
  </div>
  <div class="work-flow"><span data-ko="문의 → 작업·자료 확인 → MAIA 진단 → 작은 시험의 범위 협의" data-en="Contact → review task and evidence → MAIA check → agree a small test"></span><a href="maia.html" data-ko="먼저 MAIA 진단 해 보기 →" data-en="Try the MAIA check first →"></a></div>
  <div class="foot"><a href="index.html" data-ko="← 홈으로" data-en="← Home"></a><span>Esc</span><span class="r">chahn@kopo.ac.kr</span></div>
</div></div>
<script src="assets/i18n.js?v=20261022o"></script>
<script src="assets/site.js?v=20261022o"></script>
<script>
(function(){
const L=window.LAB, topics=[['현장 작업 문의','Field task enquiry'],['교육·실습 문의','Teaching enquiry'],['공동연구 문의','Research enquiry']];
L.onLang.push(()=>document.querySelectorAll('.inquiry').forEach(a=>{
  const t=topics[Number(a.dataset.topic)],subject='[AI for Energy & Manufacturing Lab] '+L.T(t[0],t[1]);
  const body=L.T('검토할 작업:\n목적:\n공유 가능한 자료:\n제약과 일정:\n','Task to examine:\nGoal:\nShareable evidence:\nConstraints and timing:\n');
  a.href='mailto:chahn@kopo.ac.kr?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body);
}));
})();
</script>
</body>
</html>
